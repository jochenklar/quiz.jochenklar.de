<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#241a5c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Moon Quiz">
  <title>Moon Quiz</title>
  <link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="top">
      <h1 class="title">Moon Quiz!</h1>
      <div class="scores">
        <div class="score">
          <span class="label">Streak</span>
          <span class="value" id="streak">0</span>
        </div>
        <div class="score best">
          <span class="label">Best</span>
          <span class="value" id="best">0</span>
        </div>
      </div>
    </header>

    <section class="panel">
      <p class="caption">Guess the planet!</p>
      <div class="art" id="art"></div>
      <h2 class="moon" id="moon">…</h2>
      <button type="button" class="timer" id="timer" hidden aria-label="Next moon">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle class="timer-track" cx="20" cy="20" r="16" />
          <circle class="timer-ring" cx="20" cy="20" r="16" pathLength="100" />
        </svg>
        <span class="timer-count" id="timer-count"></span>
      </button>
      <div class="burst" id="burst" hidden>
        <div class="burst-shape"><span id="burst-text"></span></div>
      </div>
    </section>

    <div class="bubble" id="bubble" aria-live="polite">
      <div class="bubble-body">
        <p class="fact" id="fact"></p>
        <p class="meta" id="meta"></p>
      </div>
    </div>

    <div class="answers" id="answers">
      <button type="button" class="planet jupiter" data-planet="Jupiter"><kbd>1</kbd>Jupiter</button>
      <button type="button" class="planet saturn" data-planet="Saturn"><kbd>2</kbd>Saturn</button>
      <button type="button" class="planet uranus" data-planet="Uranus"><kbd>3</kbd>Uranus</button>
      <button type="button" class="planet neptune" data-planet="Neptune"><kbd>4</kbd>Neptune</button>
    </div>

  </main>

  <script src="moons.js"></script>
  <script src="art.js"></script>
  <script src="app.js"></script>
</body>
</html>
